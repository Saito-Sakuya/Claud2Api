name: Publish compatible release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Wait for the exact trusted main build
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const workflow = await github.rest.actions.getWorkflow({owner, repo, workflow_id: 'build.yml'});
            const deadline = Date.now() + 30 * 60 * 1000;
            let minute = 0;
            while (true) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: workflow.data.id, head_sha: context.sha, per_page: 100
              });
              const runs = response.data.workflow_runs
                .filter(run => run.workflow_id === workflow.data.id && run.head_sha === context.sha &&
                  run.event === 'push' && run.head_branch === 'main')
                .sort((a, b) => b.run_number - a.run_number || b.created_at.localeCompare(a.created_at));
              const run = runs[0];
              core.info(`Minute ${minute}: ${run ? `main run ${run.id} attempt ${run.run_attempt} is ${run.status}${run.conclusion ? ` (${run.conclusion})` : ''}` : 'no matching main push run yet'}`);
              if (run && run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error(`Trusted main verification failed for ${context.sha}: ${run.html_url} (${run.conclusion})`);
                }
                const artifactName = `release-assets-${run.id}-${run.run_attempt}`;
                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: run.id, per_page: 100});
                const artifact = artifacts.data.artifacts.find(item => item.name === artifactName);
                if (!artifact || artifact.expired || artifact.size_in_bytes <= 0) {
                  throw new Error(`Successful main run ${run.id} attempt ${run.run_attempt} has no unexpired ${artifactName} artifact`);
                }
                const sourceRun = artifact.workflow_run;
                if (sourceRun && (sourceRun.id !== run.id || sourceRun.head_sha !== context.sha ||
                    sourceRun.head_branch !== 'main')) {
                  throw new Error('Artifact run metadata does not match the selected trusted main attempt');
                }
                core.setOutput('run_id', String(run.id));
                core.setOutput('run_attempt', String(run.run_attempt));
                core.setOutput('artifact_name', artifactName);
                core.setOutput('run_url', run.html_url);
                return;
              }
              if (Date.now() >= deadline) {
                throw new Error(`No successful trusted main verification artifact for ${context.sha} within 30 minutes`);
              }
              await new Promise(resolve => setTimeout(resolve, Math.min(60_000, deadline - Date.now())));
              minute += 1;
            }
        timeout-minutes: 31
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release
      - name: Verify source provenance and packaged checksums
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_TAG: ${{ github.ref_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RUN_ID: ${{ steps.source.outputs.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path("release")
          expected = {
              "schema": 1,
              "repository": os.environ["EXPECTED_REPOSITORY"],
              "commit": os.environ["EXPECTED_COMMIT"],
              "event": "push",
              "ref": "refs/heads/main",
              "run_id": int(os.environ["EXPECTED_RUN_ID"]),
              "run_attempt": int(os.environ["EXPECTED_RUN_ATTEMPT"]),
              "tag": os.environ["EXPECTED_TAG"],
          }
          provenance = json.loads((root / "build-provenance.json").read_text(encoding="utf-8"))
          for key, value in expected.items():
              if provenance.get(key) != value:
                  raise SystemExit(f"build provenance mismatch for {key}")
          if provenance.get("workflow") != "Build Claud2Api":
              raise SystemExit("artifact was not created by the expected verification workflow")

          tag, binary_name = expected["tag"], "claud2api-linux-amd64"
          manifest = json.loads((root / "claud2api-update.json").read_text(encoding="utf-8"))
          if manifest.get("version") != tag or manifest.get("binary") != binary_name:
              raise SystemExit("release tag and update manifest disagree")
          if not re.fullmatch(r"[0-9a-f]{64}", str(manifest.get("sha256", ""))):
              raise SystemExit("invalid binary checksum in update manifest")

          listed = {}
          for line in (root / "SHA256SUMS").read_text(encoding="ascii").splitlines():
              match = re.fullmatch(r"([0-9a-f]{64})  ([A-Za-z0-9._-]+)", line)
              if not match or match.group(2) in listed:
                  raise SystemExit("invalid SHA256SUMS entry")
              listed[match.group(2)] = match.group(1)
          expected_sum_names = {binary_name, "claud2api-update.json", "claud2api-licenses.tar.gz"}
          if set(listed) != expected_sum_names:
              raise SystemExit("SHA256SUMS does not contain exactly the three release payloads")
          asset_names = expected_sum_names | {"SHA256SUMS"}
          provenance_files = asset_names | {"RELEASE_NOTES.md"}
          if set(provenance.get("assets", {})) != provenance_files:
              raise SystemExit("artifact asset provenance is incomplete")
          for name in provenance_files:
              digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if provenance["assets"].get(name) != digest:
                  raise SystemExit(f"artifact provenance checksum mismatch: {name}")
              if name in listed and listed[name] != digest:
                  raise SystemExit(f"SHA256SUMS mismatch: {name}")
          if manifest["sha256"] != hashlib.sha256((root / binary_name).read_bytes()).hexdigest():
              raise SystemExit("update manifest binary checksum mismatch")
          if manifest.get("size") != (root / binary_name).stat().st_size:
              raise SystemExit("update manifest binary size mismatch")
          print(json.dumps({"commit": expected["commit"], "tag": tag,
                            "verified_run_id": expected["run_id"],
                            "verified_run_attempt": expected["run_attempt"],
                            "assets": sorted(asset_names)}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
  container:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Build the image from the verified release binary
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${RELEASE_TAG#v}"
          (cd release && sha256sum --check SHA256SUMS)
          docker build --platform linux/amd64 -f Dockerfile.release \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$RELEASE_TAG" .
          echo "name=$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify the final image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/container_acceptance.py --image "$IMAGE" --version "$RELEASE_TAG"
      - name: Publish to GitHub Container Registry
        id: push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker push "${IMAGE%:*}:$RELEASE_TAG"
          DIGEST=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
  publish:
    needs: [package, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - uses: actions/github-script@v7
        env:
          RELEASE_IMAGE: ${{ needs.container.outputs.image }}
          RELEASE_IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const tag = context.ref.replace('refs/tags/', '');
            const manifest = JSON.parse(fs.readFileSync('release/claud2api-update.json', 'utf8'));
            if (manifest.version !== tag) throw new Error('Tag and manifest disagree');
            const repo = {...context.repo};
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...repo, tag})).data;
              if (!release.draft) throw new Error('Published releases are immutable; use a new version');
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({...repo, tag_name: tag,
                name: tag, draft: true, prerelease: tag.split('+')[0].includes('-'),
                body: fs.readFileSync('release/RELEASE_NOTES.md', 'utf8') +
                  '\n\nDocker: `' + process.env.RELEASE_IMAGE + '`\n\nDigest: `' + process.env.RELEASE_IMAGE_DIGEST + '`\n\n' +
                  '[发行文件说明 / Release files](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/blob/' + tag + '/RELEASES_ZH.md)'})).data;
            }
            // Keep the draft unpublished until every release asset digest matches.
            for (const name of ['claud2api-linux-amd64', 'claud2api-update.json', 'claud2api-licenses.tar.gz', 'SHA256SUMS']) {
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({...repo, asset_id: existing.id});
              const data = fs.readFileSync('release/' + name);
              const asset = (await github.rest.repos.uploadReleaseAsset({...repo,
                release_id: release.id, name, data,
                headers: {'content-type': 'application/octet-stream', 'content-length': data.length}})).data;
              const expected = 'sha256:' + crypto.createHash('sha256').update(data).digest('hex');
              if (asset.digest !== expected || asset.size !== data.length || asset.state !== 'uploaded')
                throw new Error('GitHub asset verification failed: ' + name);
            }
            await github.rest.repos.updateRelease({...repo, release_id: release.id, draft: false});
