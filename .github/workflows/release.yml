name: Publish compatible release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    container: rust:1-bookworm@sha256:e12566d5abc17a0da741628782cdb504b68b8961f5bfcf677936bf3e8b32de29
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: apt-get update && apt-get install -y --no-install-recommends cmake perl pkg-config libclang-dev python3 binutils
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked --all-targets
      - run: python3 scripts/update_acceptance.py --artifacts /tmp/update-acceptance --build
      - run: cargo build --locked --release
      - name: Prepare verified assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package_release.py --binary target/release/claud2api --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
  container:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Build the image from the verified release binary
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${RELEASE_TAG#v}"
          (cd release && sha256sum --check SHA256SUMS)
          docker build --platform linux/amd64 -f Dockerfile.release \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$RELEASE_TAG" .
          echo "name=$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify the final image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/container_acceptance.py --image "$IMAGE" --version "$RELEASE_TAG"
      - name: Publish to GitHub Container Registry
        id: push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker push "${IMAGE%:*}:$RELEASE_TAG"
          DIGEST=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
  publish:
    needs: [package, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - uses: actions/github-script@v7
        env:
          RELEASE_IMAGE: ${{ needs.container.outputs.image }}
          RELEASE_IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const tag = context.ref.replace('refs/tags/', '');
            const manifest = JSON.parse(fs.readFileSync('release/claud2api-update.json', 'utf8'));
            if (manifest.version !== tag) throw new Error('Tag and manifest disagree');
            const repo = {...context.repo};
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...repo, tag})).data;
              if (!release.draft) throw new Error('Published releases are immutable; use a new version');
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({...repo, tag_name: tag,
                name: tag, draft: true, prerelease: tag.split('+')[0].includes('-'),
                body: fs.readFileSync('release/RELEASE_NOTES.md', 'utf8') +
                  '\n\nDocker: `' + process.env.RELEASE_IMAGE + '`\n\nDigest: `' + process.env.RELEASE_IMAGE_DIGEST + '`\n\n' +
                  '[发行文件说明 / Release files](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/blob/' + tag + '/RELEASES_ZH.md)'})).data;
            }
            // Keep the draft invisible until every asset has its expected digest.
            for (const name of ['claud2api-linux-amd64', 'claud2api-update.json', 'claud2api-licenses.tar.gz', 'SHA256SUMS']) {
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({...repo, asset_id: existing.id});
              const data = fs.readFileSync('release/' + name);
              const asset = (await github.rest.repos.uploadReleaseAsset({...repo,
                release_id: release.id, name, data,
                headers: {'content-type': 'application/octet-stream', 'content-length': data.length}})).data;
              const expected = 'sha256:' + crypto.createHash('sha256').update(data).digest('hex');
              if (asset.digest !== expected || asset.size !== data.length || asset.state !== 'uploaded')
                throw new Error('GitHub asset verification failed: ' + name);
            }
            await github.rest.repos.updateRelease({...repo, release_id: release.id, draft: false});
